});

document.getElementById('fab').addEventListener('click', () => {
  if (state.currentView === 'home') openAddTenant();
});

document.getElementById('headerBell').addEventListener('click', () => switchView('alerts'));

document.getElementById('queueBadgeBtn').addEventListener('click', async () => {
  const q = getQueue();
  if (q.length === 0) { toast('Nothing to sync'); return; }
  if (!confirm(`${q.length} change(s) queued. Sync now?`)) return;
  await processQueue();
});

// ===== TOAST =====
let toastTimeout;
function toast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toastText').textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => t.classList.remove('show'), 2400);
}

// ===== AUTH SCREEN =====
function resetAuthButtons() {
  document.querySelectorAll('.auth-form button[type="submit"]').forEach(b => { b.disabled = false; });
  const map = {
    signinForm: 'Sign in',
    signupForm: 'Create account',
    forgotForm: 'Reset PIN',
  };
  Object.entries(map).forEach(([id, label]) => {
    const el = document.querySelector(`#${id} button[type="submit"]`);
    if (el) el.textContent = label;
  });
  const fs = document.getElementById('forgotSendBtn'); if (fs) { fs.disabled = false; fs.textContent = 'Send code'; }
  const fv = document.getElementById('forgotVerifyBtn'); if (fv) { fv.disabled = false; fv.textContent = 'Verify code'; }
}

function showAuthScreen(mode) {
  const screen = document.getElementById('authScreen');
  screen.classList.remove('hide');
  const signin = document.getElementById('signinForm');
  const signup = document.getElementById('signupForm');
  const forgot = document.getElementById('forgotForm');
  const sub = document.getElementById('authSub');
  const showSignupBtn = document.getElementById('showSignupBtn');
  const showSigninBtn = document.getElementById('showSigninBtn');
  const showForgotBtn = document.getElementById('showForgotBtn');
  const switchDot1 = document.getElementById('switchDot1');
  const switchDot2 = document.getElementById('switchDot2');

  signin.style.display = 'none'; signup.style.display = 'none'; forgot.style.display = 'none';
  showSignupBtn.style.display = 'none'; showSigninBtn.style.display = 'none';
  showForgotBtn.style.display = 'none'; switchDot1.style.display = 'none'; switchDot2.style.display = 'none';

  if (mode === 'signin') {
    signin.style.display = 'block';
    sub.textContent = 'Sign in to sync your ledger everywhere';
    showSignupBtn.style.display = 'inline';
    showForgotBtn.style.display = 'inline';
    switchDot1.style.display = 'inline';
    switchDot2.style.display = 'inline';
  } else if (mode === 'signup') {
    signup.style.display = 'block';
    sub.textContent = 'Create your account. E free.';
    showSigninBtn.style.display = 'inline';
  } else if (mode === 'forgot') {
    forgot.style.display = 'block';
    sub.textContent = 'Reset your PIN';
    showSigninBtn.style.display = 'inline';
    document.getElementById('forgotStep1').style.display = 'block';
    document.getElementById('forgotStep2').style.display = 'none';
    document.getElementById('forgotStep3').style.display = 'none';
    document.getElementById('forgotForm').reset();
    otpPhone = ''; otpVerified = false; otpMode = 'cloud';
  }
  resetAuthButtons();
  hideAuthError();
  hideAuthInfo();
}

function showAuthError(msg) {
  const el = document.getElementById('authError');
  el.textContent = msg; el.style.display = 'block';
  hideAuthInfo();
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.display = 'none'; }, 9000);
}
function hideAuthError() { document.getElementById('authError').style.display = 'none'; }
function showAuthInfo(msg) {
  const el = document.getElementById('authInfo');
  el.textContent = msg; el.style.display = 'block';
  hideAuthError();
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.display = 'none'; }, 6000);
}
function hideAuthInfo() { document.getElementById('authInfo').style.display = 'none'; }

function authDone() {
  document.getElementById('authScreen').classList.add('hide');
  document.getElementById('appHeader').style.display = 'flex';
  document.getElementById('bottomNav').style.display = 'flex';
  initMain();
}

document.getElementById('showSignupBtn').addEventListener('click', () => showAuthScreen('signup'));
document.getElementById('showSigninBtn').addEventListener('click', () => showAuthScreen('signin'));
document.getElementById('showForgotBtn').addEventListener('click', () => showAuthScreen('forgot'));

// --- keep PIN fields numeric only ---
document.querySelectorAll('.pin-input').forEach(inp => {
  inp.addEventListener('input', () => {
    const max = Number(inp.getAttribute('maxlength')) || 4;
    inp.value = inp.value.replace(/\D/g, '').slice(0, max);
  });
});

document.getElementById('signinForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  hideAuthError(); hideAuthInfo();
  const fd = new FormData(e.target);
  const btn = e.target.querySelector('button[type="submit"]');
  const orig = btn.textContent;
  const phone = String(fd.get('phone') || '').trim();
  const pin = String(fd.get('pin') || '').trim();

  if (!phone) return showAuthError('Enter your phone number');
  if (!/^\d{4}$/.test(pin)) return showAuthError('PIN must be 4 digits');

  btn.textContent = 'Signing in...'; btn.disabled = true;
  try {
    await doSignin({ phone, pin });
    if (useCloud) await loadTenants();
    else loadData();
    authDone();
    toast(currentAgent.local ? 'Signed in (local)' : 'Signed in');
  } catch (err) {
    console.error(err);
    showAuthError(err.message || 'Something went wrong');
    btn.textContent = orig; btn.disabled = false;
  }
});

document.getElementById('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  hideAuthError(); hideAuthInfo();
  const fd = new FormData(e.target);
  const btn = e.target.querySelector('button[type="submit"]');
  const orig = btn.textContent;
  const name = String(fd.get('name') || '').trim();
  const phone = String(fd.get('phone') || '').trim();
  const pin = String(fd.get('pin') || '').trim();
  const pin2 = String(fd.get('pin2') || '').trim();

  if (!name) return showAuthError('Enter your name');
  if (!isValidNgPhone(normalizePhone(phone))) return showAuthError('Enter a valid phone number, e.g. 08012345678');
  if (!/^\d{4}$/.test(pin)) return showAuthError('PIN must be 4 digits');
  if (pin !== pin2) return showAuthError('PINs no match');

  btn.textContent = 'Creating...'; btn.disabled = true;
  try {
    await doSignup({ name, phone, pin });
    if (useCloud) await loadTenants();
    else loadData();
    authDone();
    toast(currentAgent.local ? 'Account created (on this phone)' : 'Account created');
  } catch (err) {
    console.error(err);
    showAuthError(err.message || 'Could not create account');
    btn.textContent = orig; btn.disabled = false;
  }
});

document.getElementById('forgotSendBtn').addEventListener('click', async () => {
  hideAuthError(); hideAuthInfo();
  const phoneInput = document.querySelector('#forgotStep1 input[name="phone"]');
  const normalized = normalizePhone(phoneInput.value);
  if (!isValidNgPhone(normalized)) return showAuthError('Enter a valid phone number, e.g. 08012345678');

  const btn = document.getElementById('forgotSendBtn');
  const orig = btn.textContent;
  btn.textContent = 'Please wait...'; btn.disabled = true;

  try {
    // 1) Local account on this device → skip OTP entirely
    const accounts = getLocalAccounts();
    if (accounts[normalized]) {
      otpPhone = normalized; otpMode = 'local'; otpVerified = true;
      document.getElementById('forgotStep1').style.display = 'none';
      document.getElementById('forgotStep2').style.display = 'none';
      document.getElementById('forgotStep3').style.display = 'block';
      showAuthInfo('Local account found. Set your new PIN below.');
      return;
    }

    // 2) Cloud account → send OTP
    if (!supabase) throw new Error('No account found on this device. Create one first.');

    const agent = await findAgentByPhone(normalized);
    if (!agent) throw new Error('No account found with this number.');

    const res = await fetch(`${SUPABASE_URL}/functions/v1/send-otp`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
      body: JSON.stringify({ phone: normalized }),
    });

    let data;
    try { data = await res.json(); }
    catch { throw new Error('OTP service no dey available (HTTP ' + res.status + ').'); }
    if (!data.ok) throw new Error(data.error || 'Could not send code');

    otpPhone = normalized; otpMode = 'cloud'; otpVerified = false;
    document.getElementById('forgotStep1').style.display = 'none';
    document.getElementById('forgotStep2').style.display = 'block';
    document.getElementById('forgotStep3').style.display = 'none';
    const otpInput = document.querySelector('#forgotStep2 input[name="otp"]');
    if (otpInput) otpInput.value = '';
    const sentVia = data.channel === 'whatsapp' ? 'WhatsApp' : 'SMS';
    document.getElementById('otpPhoneHint').textContent = `Code sent to ${prettyPhone(normalized)} via ${sentVia}`;
    showAuthInfo(`✅ Code sent via ${sentVia}!`);
  } catch (err) {
    console.error(err);
    showAuthError(err.message);
  } finally {
    btn.textContent = orig; btn.disabled = false;
  }
});

document.getElementById('forgotVerifyBtn').addEventListener('click', async () => {
  hideAuthError(); hideAuthInfo();
  const otp = String(document.querySelector('#forgotStep2 input[name="otp"]').value || '').trim();
  if (!/^\d{6}$/.test(otp)) return showAuthError('Enter the 6-digit code');

  const btn = document.getElementById('forgotVerifyBtn');
  const orig = btn.textContent;
  btn.textContent = 'Verifying...'; btn.disabled = true;

  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/verify-otp`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
      body: JSON.stringify({ phone: otpPhone, code: otp, action: 'verify' }),
    });
    let data;
    try { data = await res.json(); }
    catch { throw new Error('OTP service no dey available (HTTP ' + res.status + ').'); }
    if (!data.ok) throw new Error(data.error || 'Wrong code');

    otpVerified = true;
    document.getElementById('forgotStep2').style.display = 'none';
    document.getElementById('forgotStep3').style.display = 'block';
    showAuthInfo('Code verified. Set your new PIN.');
  } catch (err) {
    showAuthError(err.message);
  } finally {
    btn.textContent = orig; btn.disabled = false;
  }
});

document.getElementById('forgotResendBtn').addEventListener('click', () => {
  document.getElementById('forgotStep1').style.display = 'block';
  document.getElementById('forgotStep2').style.display = 'none';
  document.querySelector('#forgotStep1 input[name="phone"]').value = prettyPhone(otpPhone);
  const otpInput = document.querySelector('#forgotStep2 input[name="otp"]');
  if (otpInput) otpInput.value = '';
  hideAuthError(); hideAuthInfo();
});

document.getElementById('forgotForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  hideAuthError(); hideAuthInfo();
  if (!otpPhone) return showAuthError('Start over — enter your phone number first.');
  if (!otpVerified) return showAuthError('Verify the code first.');

  const newPin = String(document.querySelector('#forgotStep3 input[name="newPin"]').value || '').trim();
  const newPin2 = String(document.querySelector('#forgotStep3 input[name="newPin2"]').value || '').trim();
  if (!/^\d{4}$/.test(newPin)) return showAuthError('PIN must be 4 digits');
  if (newPin !== newPin2) return showAuthError('PINs no match');

  const btn = e.target.querySelector('#forgotStep3 button[type="submit"]');
  const orig = btn.textContent;
  btn.textContent = 'Resetting...'; btn.disabled = true;

  try {
    if (otpMode === 'local') {
      const accounts = getLocalAccounts();
      if (!accounts[otpPhone]) throw new Error('Local account no dey anymore.');
      accounts[otpPhone].pin_hash = await hashStr(newPin + '::' + otpPhone);
      saveLocalAccounts(accounts);
      await doSignin({ phone: otpPhone, pin: newPin });
      loadData();
    } else {
      const otp = String(document.querySelector('#forgotStep2 input[name="otp"]').value || '').trim();
      const res = await fetch(`${SUPABASE_URL}/functions/v1/verify-otp`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
        body: JSON.stringify({ phone: otpPhone, code: otp, action: 'reset', newPin }),
      });
      let data;
      try { data = await res.json(); }
      catch { throw new Error('OTP service no dey available (HTTP ' + res.status + ').'); }
      if (!data.ok) throw new Error(data.error);

      await doSignin({ phone: otpPhone, pin: newPin });
      await loadTenants();
    }

    otpPhone = ''; otpVerified = false; otpMode = 'cloud';
    authDone();
    toast('PIN reset. You don sign in.');
  } catch (err) {
    console.error(err);
    showAuthError(err.message);
    btn.textContent = orig; btn.disabled = false;
  }
});

document.getElementById('authGuest').addEventListener('click', () => {
  useCloud = false; currentAgent = null;
  setSession(null);
  document.getElementById('authScreen').classList.add('hide');
  document.getElementById('appHeader').style.display = 'flex';
  document.getElementById('bottomNav').style.display = 'flex';
  initMain();
});

// ===== ONLINE/OFFLINE =====
window.addEventListener('online', () => {
  isOnline = true;
  toast('Back online — syncing...');
  processQueue();
  if (useCloud && currentAgent && !currentAgent.local) loadTenants().then(() => render());
});

window.addEventListener('offline', () => {
  isOnline = false;
  syncStatus = 'offline';
  updateSyncUI();
  toast('Offline. Changes go sync later.');
});

// ===== INIT =====
async function init() {
  if (booted) return;
  booted = true;

  loadData();

  // No supabase configured → straight to guest mode
  if (!supabase) {
    useCloud = false;
    document.getElementById('authScreen').classList.add('hide');
    document.getElementById('appHeader').style.display = 'flex';
    document.getElementById('bottomNav').style.display = 'flex';
    initMain();
    return;
  }

  // Restore session
  const session = getSession();
  if (session && session.id) {
    currentAgent = session;
    useCloud = !session.local;
    document.getElementById('authScreen').classList.add('hide');
    document.getElementById('appHeader').style.display = 'flex';
    document.getElementById('bottomNav').style.display = 'flex';
    if (useCloud) await loadTenants();
    else loadData();
    initMain();
  } else {
    showAuthScreen('signin');
  }
}

function initMain() {
  if (appInitialized) { render(); return; }
  appInitialized = true;
  render();

  const settings = getReminderSettings();
  if (settings.enabled === undefined) {
    saveReminderSettings({ enabled: true, daysBefore: 14 });
  }

  checkReminders({ showSystem: false });
  clearInterval(window._reminderTimer);
  window._reminderTimer = setInterval(() => checkReminders({ showSystem: true }), 5 * 60 * 1000);

  if (useCloud && currentAgent && !currentAgent.local) {
    fetchBalance().then(() => {
      if (state.currentView === 'settings' || state.currentView === 'home') render();
    });
    processQueue();
  }
}

// Boot (guarded so it only ever runs once)
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
})();
</script>
